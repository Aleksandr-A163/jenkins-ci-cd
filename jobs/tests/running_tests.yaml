---
- job:
    name: running_tests
    description: "Запуск UI и mobile тестов с объединённым Allure-отчётом"
    project-type: pipeline
    concurrent: true
    sandbox: true
    parameters:
      - bool:
          name: RUN_UI
          default: true
          description: "Запустить job ui_tests"
      - bool:
          name: RUN_MOBILE
          default: true
          description: "Запустить job mobile_tests"
    dsl: |
      pipeline {{
          agent any

          stages {{
              stage('Run selected tests') {{
                  steps {{
                      script {{
                          def branches = [:]

                          if (params.RUN_UI) {{
                              branches['UI tests'] = {{
                                  build job: 'ui_tests', wait: true, propagate: true
                              }}
                          }}

                          if (params.RUN_MOBILE) {{
                              branches['Mobile tests'] = {{
                                  build job: 'mobile_tests', wait: true, propagate: true
                              }}
                          }}

                          if (branches.isEmpty()) {{
                              error('Не выбрана ни одна job для запуска')
                          }}

                          parallel branches
                      }}
                  }}
              }}
          }}
      }}