---
- job:
    name: running_tests
    description: "Запуск UI и mobile тестов из одной job"
    project-type: pipeline
    concurrent: true
    parameters:
      - bool:
          name: RUN_UI
          default: true
          description: "Запустить ui_tests"
      - bool:
          name: RUN_MOBILE
          default: true
          description: "Запустить mobile_tests"
    pipeline-scm:
      scm:
        - git:
            url: https://github.com/Aleksandr-A163/jenkins-ci-cd.git
            credentials-id: github
            branches:
              - main
      script-path: pipeline/run_tests.groovy